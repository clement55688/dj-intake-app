<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="intake-token" content="__TOKEN__"><title>DJ Intake · Quick add</title><link rel="stylesheet" href="/style.css"><script defer src="/quick.js"></script></head>
<body class="quick-body"><main class="quick-main">
<div class="quick-hero"><div class="quick-brand"><span class="logo" aria-hidden="true"></span><div><h1>DJ Intake</h1><p>Your next track, one paste away.</p></div><button id="quick-settings" class="pill ghost icon" aria-label="Settings" aria-expanded="false">⚙</button></div></div>
<section id="quick-preferences" hidden><span class="eyebrow">Default download folder</span><p id="quick-path"></p><button id="quick-pick" class="pill ghost">Choose folder…</button><p id="folder-status" role="status"></p></section>
<form id="quick-form"><label for="quick-input" class="eyebrow">Track URL or song name</label><textarea id="quick-input" rows="2" placeholder="Paste a URL or Artist — Song" required autofocus></textarea><label class="trim-toggle"><input id="quick-trim" type="checkbox"> Trim to timestamps</label><div class="clip-inputs" id="quick-fields" hidden><div><label for="quick-start">Start</label><input id="quick-start" placeholder="00:00" autocomplete="off"></div><span class="clip-arrow">→</span><div><label for="quick-end">End</label><input id="quick-end" placeholder="00:00" autocomplete="off"></div></div><button class="pill primary quick-submit" id="quick-submit">Add to queue ↗</button><p id="quick-status" role="status" hidden></p></form>
<div class="quick-listen"><button id="quick-identify" class="pill ghost listen-mini">Identify song <span class="rings" aria-hidden="true"></span></button><button id="quick-recognition-setup" class="pill ghost">Set up recognition ↗</button><span id="quick-recognition-status" role="status"></span><small class="quick-hint">Shazam names the song playing on your Mac or nearby.</small></div>
<div class="quick-footer"><button class="text-button open" id="quick-open">Open full library ↗</button><button class="text-button" id="quick-quit">Quit menu bar</button></div>
</main></body></html>
