<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="intake-token" content="__TOKEN__"><title>DJ Intake · Quick add</title><link rel="stylesheet" href="/style.css"><script defer src="/quick.js"></script></head>
<body class="quick-body"><main class="quick-main"><div class="quick-brand"><img src="/app-icon.png" alt=""><div><h1>DJ Intake</h1><p>Your next track, one paste away.</p></div><button id="quick-settings" class="button subtle" aria-label="Settings" aria-expanded="false">⚙</button></div><section id="quick-preferences" hidden><label>DEFAULT DOWNLOAD FOLDER</label><p id="quick-path"></p><button id="quick-pick" class="button subtle">Choose folder…</button><p id="folder-status" role="status"></p></section><form id="quick-form"><label for="quick-input">TRACK URL OR SONG NAME</label><textarea id="quick-input" rows="2" placeholder="Paste a URL or Artist — Song" required autofocus></textarea><label class="trim-toggle"><input id="quick-trim" type="checkbox"> Trim to timestamps</label><div class="clip-inputs" id="quick-fields" hidden><div><label for="quick-start">START</label><input id="quick-start" placeholder="00:00" autocomplete="off"></div><span class="clip-arrow">→</span><div><label for="quick-end">END</label><input id="quick-end" placeholder="00:00" autocomplete="off"></div></div><button class="button primary quick-submit" id="quick-submit">Add to queue ↗</button><p id="quick-status" role="status" hidden></p></form><div class="quick-footer"><button class="text-button" id="quick-open">Open library ↗</button><button class="text-button" id="quick-quit">Quit menu bar</button></div></main></body></html>
