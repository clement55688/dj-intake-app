name: Report a bug
description: Tell us what went wrong in DJ Intake
title: "[Bug]: "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the steps and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened?
      description: Include the visible error if useful. Remove private links, file paths, account details, and tokens.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: macOS and DJ Intake versions
